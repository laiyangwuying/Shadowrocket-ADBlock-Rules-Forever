name: Build Shadowrocket Rules

on:
  schedule:
    # 每日北京时间 8:00（UTC 23:00）
    - cron: '0 23 * * *'

  push:
    branches:
      - build
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Install requirements
        run: pip3 install -r requirements.txt

      - name: Run build
        run: ./factory/auto_build.sh

      - name: Fetch lazy rules
        run: |
          set -euo pipefail
          fetch() {
            local name="$1" url="$2"
            local tmp="${name}.dl"
            if curl -fsSL --retry 3 --retry-delay 2 -o "$tmp" "$url" && [ -s "$tmp" ]; then
              mv "$tmp" "$name"
              echo "OK $name"
            else
              rm -f "$tmp"
              if [ -s "$name" ] && ! grep -q 'Not Found' "$name"; then
                echo "WARN: keep existing $name" >&2
              else
                echo "ERROR: cannot fetch $name and no valid local copy" >&2
                exit 1
              fi
            fi
          }
          fetch lazy.conf 'https://raw.githubusercontent.com/wlxuf/Shadowrocket/main/lazy.conf'
          fetch lazy_group.conf 'https://raw.githubusercontent.com/wlxuf/Shadowrocket/main/lazy_group.conf'

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          BRANCH: build
          FOLDER: .
          commit-message: 'Nightly build'
