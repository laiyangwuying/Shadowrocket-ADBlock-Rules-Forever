[Rule]
# === 局域网与本地回环（直接连接） ===
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,fe80::/10,DIRECT
IP-CIDR,fc00::/7,DIRECT
IP-CIDR,::1/128,DIRECT
# === 直连/混合 FINAL 配置专用：按域名将 UDP 降级为 TCP（不走 PROXY 的流量不会被上方全局规则命中） ===
# YouTube 播放依赖 googlevideo QUIC/UDP，此处不得 REJECT；去广告请单独启用 module/YouTubeNoAd.sgmodule。

# === Twitter/X：UDP 降级，避免客户端刷不出时间线 ===
AND,((DOMAIN-SUFFIX,twimg.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,twitter.com), (PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,x.com), (PROTOCOL,UDP)),REJECT
