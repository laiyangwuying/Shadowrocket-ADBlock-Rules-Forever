GEOIP,CN,DIRECT

FINAL,proxy
[URL Rewrite]
# Redirect Google Search Service
^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
# Redirect Google Maps Service
^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302
# youtube
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200

[MITM]
enable = true
h2 = true
# 修正说明：移除了所有空格、去除了重复域名、规范了小火箭的解密主机列表
hostname = *.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com,api.twitter.com,*.twitter.com,mp.weixin.qq.com,-redirector*.googlevideo.com

[Script]
# 过滤 Twitter/X 时间线广告、搜索页广告、GraphQL 接口推广
twitter-ads = type=http-response,pattern=^https?:\/\/api\.twitter\.com\/(1\.1|2)\/(timeline|search|guide|page|status|tweets|graphql),requires-body=1,max-size=0,script-path=https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/script/twitter/twitter.js,argument=line

# 微信公众号去广告
微信公众号去广告 = type=http-response,pattern=^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad,requires-body=1,script-path=https://raw.githubusercontent.com/NobyDa/Script/master/QuantumultX/File/Wechat.js

# YouTube 去广告（优化参数格式，防止大括号/双引号引发的小火箭解析异常）
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch),requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument=lyricLang=zh-Hans,captionLang=zh-Hans,blockUpload=true,blockImmersive=true,debug=false
