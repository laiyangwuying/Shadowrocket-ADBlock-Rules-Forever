[URL Rewrite]
# Redirect Google Search Service
^https?:\/\/(www.)?(g|google)\.cn https://www.google.com 302
# Redirect Google Maps Service
^https?:\/\/(ditu|maps).google\.cn https://maps.google.com 302
# youtube（与 Maasea YouTube.Enhance.sgmodule 中 [URL Rewrite] / Map Local 语义对齐，便于 SR）
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
# 对应上游 [Map Local] initplayback：阻断带 oad 的初始化播放请求
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?.*adformat= _ reject-200

[MITM]
enable = true
h2 = true
# Maasea YouTube / 微信；不包含 X/Twitter（避免对已失效脚本做 MITM；X 多以 GraphQL/proto，占位脚本易把时间线响应改坏）
hostname = -redirector*.googlevideo.com,*.googlevideo.com,www.youtube.com,s.youtube.com,m.youtube.com,youtubei.googleapis.com,mp.weixin.qq.com

[Script]
# === Twitter/X（已禁用）===
# blackberry ios_rule_script 的 twitter.js 已从仓库移除(raw 404)；旧脚本或错误响应会导致时间线/graphql 空白。
# 需要时请自行填入可用的本地/自建 script-path 后再取消下行注释：
# twitter-ads = type=http-response,pattern=^https?:\/\/api\.(twitter\.com|x\.com)\/(1\.1|2)\/(timeline|search|guide|page|status|tweets|graphql),requires-body=1,max-size=-1,script-path=...,argument=line

# === 微信公众号去广告 ===
微信公众号去广告 = type=http-response,pattern=^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad,requires-body=1,script-path=https://raw.githubusercontent.com/NobyDa/Script/master/QuantumultX/File/Wechat.js

# === YouTube（Maasea youtube.response.js；pattern 扁平写法与同仓库常见 Surge 模块一致，末尾允许 ?query）===
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{"lyricLang":"off","captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":false,"debug":false}"
